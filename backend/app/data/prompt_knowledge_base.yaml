    }

# ─────────────────────────────────────────────────────────────────────────────
# QUERY HINTS
# Last-line override instructions injected by build_prompt() based on regex matches.
# Each value starts with a leading blank line to preserve the \n prefix.
# Keys map 1-to-1 to knowledge_loader.get_query_hint("key") calls.
# ─────────────────────────────────────────────────────────────────────────────
query_hints:

  non_compliance_list: |

    ⚠ INSTRUCTION FOR THIS QUERY: The user asked for a non-compliance report WITHOUT any grouping keyword (no 'department-wise', 'by department', 'categorized', 'summary', or 'count'). You MUST generate an EMPLOYEE-LEVEL LIST — individual rows per employee per goal. NO GROUP BY. NO COUNT. Use EXAMPLE 1 from APPROVED REFERENCE SQL EXAMPLES as your exact template.

  goals_not_filled: |

    ⚠ INSTRUCTION FOR THIS QUERY: The user wants goals/remarks that have NOT been submitted. MANDATORY pattern — use the remarks-existence check, NOT the status check:
    1. INNER JOIN user_goal_mapping ugm ON u.employee_id = ugm.employee_id (not LEFT JOIN)
    2. LEFT JOIN remarks_table rt ON ugm.goal_id = rt.goal_id
    3. WHERE ... AND rt.id IS NULL  ← this keeps only goals with NO remark entry
    4. COUNT(DISTINCT ugm.id) AS goals_not_filled
    5. If a month/year is specified, add: AND MONTH(ugm.target_date)=N AND YEAR(ugm.target_date)=YYYY
    6. GROUP BY u.employee_id, u.firstname, u.lastname, d.designation_name, t.tag
    7. ORDER BY goals_not_filled DESC, employee
    8. NO HAVING needed — WHERE rt.id IS NULL automatically excludes employees with 0 missing goals.
    NEVER use: CASE WHEN s.status_name != 'Completed' for this query type.
    NEVER use: LEFT JOIN user_goal_mapping — must be INNER JOIN.
    Use EXAMPLE 18 (with date) or EXAMPLE 19 (no date) from APPROVED REFERENCE SQL EXAMPLES.

  dual_metrics: |

    ⚠ MANDATORY INSTRUCTION FOR THIS QUERY: DUAL METRICS — both compliance AND completion.
    FORBIDDEN: Do NOT generate only compliance metrics (remarks_table alone).
    FORBIDDEN: Do NOT generate only completion metrics (status alone).
    MANDATORY: Join BOTH source tables:
      LEFT JOIN remarks_table rt ON ugm.goal_id = rt.goal_id   ← for compliance
      LEFT JOIN status s ON ugm.status_id = s.id                ← for completion
    MANDATORY six columns:
      total_goals, filled_remarks, missing_remarks, compliance_pct,
      completed_goals, completion_pct
    FORMULA:
      compliance_pct = ROUND(COUNT(DISTINCT CASE WHEN rt.id IS NOT NULL THEN ugm.id END) / NULLIF(COUNT(DISTINCT ugm.id), 0) * 100, 2)
      completion_pct = ROUND(COUNT(DISTINCT CASE WHEN s.status_name = 'Completed' THEN ugm.id END) / NULLIF(COUNT(DISTINCT ugm.id), 0) * 100, 2)
    For stream comparison: GROUP BY t.tag, filter with (t.tag LIKE '%Stream1%' OR t.tag LIKE '%Stream2%').
    Use Example 29 from APPROVED REFERENCE SQL EXAMPLES as the EXACT template.

  compliance_metrics: |

    ⚠ MANDATORY INSTRUCTION FOR THIS QUERY: REMARK-BASED compliance/completion rate.
    FORBIDDEN: Do NOT start FROM user_table without joining user_goal_mapping.
    FORBIDDEN: Do NOT compute COUNT(remarks) / COUNT(employees) — this is always WRONG.
    FORBIDDEN: Do NOT use s.status_name = 'Completed' for compliance percentage.
    MANDATORY JOIN CHAIN:
      FROM user_goal_mapping ugm
      JOIN user_table u ON ugm.employee_id = u.employee_id
      LEFT JOIN remarks_table rt ON ugm.goal_id = rt.goal_id
    MANDATORY FORMULA:
      required_goals  = COUNT(DISTINCT ugm.id)
      filled_remarks  = COUNT(DISTINCT CASE WHEN rt.id IS NOT NULL THEN ugm.id END)
      missing_remarks = COUNT(DISTINCT ugm.id) - COUNT(DISTINCT CASE WHEN rt.id IS NOT NULL THEN ugm.id END)
      compliance_pct  = ROUND(filled_remarks / NULLIF(required_goals, 0) * 100, 2)
    GROUP BY the dimension asked (stream→t.tag, designation→d.designation_name, overall→no GROUP BY).
    For streams BELOW a % threshold: add HAVING compliance_pct < <threshold>.
    Use Example 20 (stream-wise) or Example 21 (overall) from APPROVED REFERENCE SQL EXAMPLES as the EXACT template.

  completion_trend: |

    ⚠ MANDATORY INSTRUCTION FOR THIS QUERY: GOAL COMPLETION TREND.
    FORBIDDEN: Do NOT use remarks_table for this query — completion is goal-STATUS based.
    FORBIDDEN: Do NOT join remarks_table or use filled_remarks / compliance_pct.
    MANDATORY JOIN: LEFT JOIN status s ON ugm.status_id = s.id
    MANDATORY FORMULA:
      total_goals    = COUNT(DISTINCT ugm.id)
      completed_goals = COUNT(DISTINCT CASE WHEN s.status_name = 'Completed' THEN ugm.id END)
      incomplete_goals = COUNT(DISTINCT CASE WHEN s.status_name IS NULL OR s.status_name <> 'Completed' THEN ugm.id END)
      completion_pct  = ROUND(completed_goals / NULLIF(total_goals, 0) * 100, 2)
    MANDATORY TREND GROUPING: GROUP BY DATE_FORMAT(ugm.target_date, '%Y-%m') ORDER BY month ASC
    DATE FILTER: 'since January 2026' → ugm.target_date >= '2026-01-01'
                 'this year'           → YEAR(ugm.target_date) = YEAR(CURDATE())
    NO GROUP BY stream/employee/designation for company-wide reports.
    Use Example 30 from APPROVED REFERENCE SQL EXAMPLES as the EXACT template.

  trend_monthly_completion_reminder: |

    ⚠ TREND GROUPING REMINDER: GROUP BY DATE_FORMAT(ugm.target_date, '%Y-%m') ORDER BY month ASC. Count GOALS (COUNT(DISTINCT ugm.id)), NEVER employees.

  trend_monthly_general: |

    ⚠ INSTRUCTION FOR THIS QUERY: TIME-SERIES / TREND report.
    DETERMINE METRIC TYPE before choosing the template:
      Goal COMPLETION trend (status-based): use Example 30 — LEFT JOIN status s, completion_pct
      Remark COMPLIANCE trend (remarks-based): use Example 24 — LEFT JOIN remarks_table rt, compliance_pct
      QoQ by stream (quarter + stream): use Example 31 — YEAR/QUARTER + t.tag GROUP BY
    MANDATORY GROUPING: GROUP BY DATE_FORMAT(ugm.target_date, '%Y-%m') ORDER BY month ASC
    Count GOALS (COUNT(DISTINCT ugm.id)), NEVER employees for trend queries.
    NEVER GROUP BY employee for a trend query.

  qoq_stream: |

    ⚠ MANDATORY INSTRUCTION FOR THIS QUERY: QUARTER-OVER-QUARTER STREAM COMPLIANCE.
    FORBIDDEN: Do NOT use DATE_FORMAT(ugm.target_date, '%Y-%m') — that gives months, not quarters.
    FORBIDDEN: Do NOT group only by quarter without also grouping by stream (t.tag).
    FORBIDDEN: Do NOT use status table for remark compliance percentage.
    MANDATORY TIME COLUMNS: YEAR(ugm.target_date) AS year, QUARTER(ugm.target_date) AS quarter
    MANDATORY STREAM JOIN: LEFT JOIN tags t ON t.tag_id = u.stream → SELECT t.tag AS stream
    MANDATORY GROUP BY: YEAR(ugm.target_date), QUARTER(ugm.target_date), t.tag
    MANDATORY ORDER BY: year ASC, quarter ASC, stream
    MANDATORY METRIC: remark compliance — LEFT JOIN remarks_table rt ON ugm.goal_id = rt.goal_id
    MANDATORY FORMULA:
      required_goals  = COUNT(DISTINCT ugm.id)
      filled_remarks  = COUNT(DISTINCT CASE WHEN rt.id IS NOT NULL THEN ugm.id END)
      missing_remarks = required_goals - filled_remarks
      compliance_pct  = ROUND(filled_remarks / NULLIF(required_goals, 0) * 100, 2)
    Use Example 31 from APPROVED REFERENCE SQL EXAMPLES as the EXACT template.

  how_many_employees: |

    ⚠ INSTRUCTION FOR THIS QUERY: The user asked HOW MANY EMPLOYEES satisfy a condition. You MUST return a SINGLE scalar count — one row, one column named employee_count. MANDATORY pattern:
      SELECT COUNT(*) AS employee_count
      FROM (
          SELECT u.employee_id
          FROM user_table u
          ... (JOINs and filters for the condition)
          GROUP BY u.employee_id
          HAVING <condition>
      ) AS qualifying_employees
    NEVER return a list of employee names. NEVER use SELECT employee, ..., COUNT(...) GROUP BY employee_id for this query. Use EXAMPLE 16 from APPROVED REFERENCE SQL EXAMPLES as your exact template.

  hierarchy: |

    ⚠ MANDATORY INSTRUCTION FOR THIS QUERY: HIERARCHY REPORT — WITH RECURSIVE is required.
    FORBIDDEN: Do NOT use nested IN (...) subqueries.
    FORBIDDEN: Do NOT use fixed-depth UNION ALL with IN (...).
    FORBIDDEN: WHERE reporting_manager IN (...) UNION ALL WHERE reporting_manager IN (...)
      — this silently misses employees below the hardcoded depth.
    MANDATORY PATTERN:
      WITH RECURSIVE hierarchy AS (
        -- Anchor: named manager at level 0
        SELECT employee_id, firstname, lastname, designation_id, stream,
               reporting_manager, 0 AS hierarchy_level
        FROM user_table WHERE <name filter> AND is_active=1 AND is_delete=0
        UNION ALL
        -- Recursive: everyone reporting into the hierarchy
        SELECT u.employee_id, u.firstname, u.lastname, u.designation_id, u.stream,
               u.reporting_manager, h.hierarchy_level + 1
        FROM user_table u
        INNER JOIN hierarchy h ON u.reporting_manager = h.employee_id
        WHERE u.is_active=1 AND u.is_delete=0
      )
      SELECT ... FROM hierarchy h WHERE h.hierarchy_level > 0
    Required output columns: employee, designation_name, stream, direct_manager, hierarchy_level
    Use Example 28 from APPROVED REFERENCE SQL EXAMPLES as the EXACT template.

  multi_stream: |

    ⚠ INSTRUCTION FOR THIS QUERY: The user specified MULTIPLE STREAM NAMES. Use t.tag IN ('Stream1', 'Stream2') — NEVER multiple LIKE conditions for exact stream lists. Still requires LEFT JOIN tags t ON t.tag_id = u.stream. Use Example 26 from APPROVED REFERENCE SQL EXAMPLES as your template.

